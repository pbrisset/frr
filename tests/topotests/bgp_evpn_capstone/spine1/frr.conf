frr defaults datacenter
!
hostname spine1
!
interface lo
 ip address 10.0.0.101/32
!
router bgp 65000
 bgp router-id 10.0.0.101
 no bgp default ipv4-unicast
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor fabric capability extended-nexthop
 neighbor eth-leaf1 interface peer-group fabric
 neighbor eth-leaf2 interface peer-group fabric
 neighbor eth-leaf3 interface peer-group fabric
 neighbor eth-leaf4 interface peer-group fabric
 neighbor eth-leaf5 interface peer-group fabric
 !
 address-family ipv4 unicast
  network 10.0.0.101/32
  neighbor fabric activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor fabric activate
 exit-address-family
!
