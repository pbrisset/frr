frr defaults datacenter
!
hostname leaf5
!
vrf VRF500
 vni 500
exit-vrf
!
interface lo
 ip address 10.0.0.5/32
!
router bgp 65015
 bgp router-id 10.0.0.5
 no bgp default ipv4-unicast
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor fabric capability extended-nexthop
 neighbor eth-spine1 interface peer-group fabric
 neighbor eth-spine2 interface peer-group fabric
 !
 address-family ipv4 unicast
  network 10.0.0.5/32
  neighbor fabric activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor fabric activate
  advertise-all-vni
  vni 2000
   rd 10.0.0.5:2000
   route-target import 2000:2000
   route-target export 2000:2000
  exit-vni
 exit-address-family
!
router bgp 65015 vrf VRF500
 bgp router-id 10.0.0.5
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  rd 10.0.0.5:500
  route-target import 500:500
  route-target export 500:500
  advertise ipv4 unicast
 exit-address-family
!
